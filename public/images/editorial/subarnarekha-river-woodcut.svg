<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFECE4"/>
      <stop offset="52%" stop-color="#DFD9CB"/>
      <stop offset="100%" stop-color="#CFC7B6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6CFC0"/>
      <stop offset="100%" stop-color="#B8AFA0"/>
    </linearGradient>
  </defs>

  <!-- Handmade Nepalese Paper Ground -->
  <rect width="1200" height="900" fill="url(#dawn)"/>

  <!-- Double Woodblock Print Margin Rules -->
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#141312" stroke-width="2"/>
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#141312" stroke-width="0.75"/>

  <!-- Pale Oxblood Dawn Sun Disc -->
  <circle cx="820" cy="250" r="78" fill="#7A1C1C" fill-opacity="0.72"/>

  <!-- Distant Chota Nagpur / Subarnarekha Ridge Contours -->
  <path d="M 46 430 Q 260 355 510 395 T 960 365 L 1154 385 L 1154 470 L 46 470 Z" fill="#3D3A36" fill-opacity="0.32"/>
  <path d="M 46 465 Q 340 410 680 445 T 1154 425 L 1154 495 L 46 495 Z" fill="#252321" fill-opacity="0.58"/>

  <!-- River Plane -->
  <rect x="46" y="485" width="1108" height="369" fill="url(#water)"/>

  <!-- Woodcut Water Current Engravings -->
  <g stroke="#141312" stroke-opacity="0.28" stroke-width="1.2" fill="none">
    <path d="M 90 535 Q 300 525 520 538 T 980 530"/>
    <path d="M 160 585 Q 420 572 690 588 T 1110 578"/>
    <path d="M 80 645 Q 360 635 640 648 T 1060 640"/>
    <path d="M 210 715 Q 480 702 790 718 T 1120 708"/>
    <path d="M 110 775 Q 380 765 650 778 T 1020 770"/>
  </g>

  <!-- Reflected Sun Shimmer on River -->
  <g stroke="#7A1C1C" stroke-opacity="0.45" stroke-width="2.5">
    <line x1="785" y1="520" x2="855" y2="520"/>
    <line x1="770" y1="548" x2="868" y2="548"/>
    <line x1="792" y1="576" x2="848" y2="576"/>
    <line x1="780" y1="604" x2="852" y2="604"/>
    <line x1="800" y1="632" x2="838" y2="632"/>
  </g>

  <!-- Solitary Country Boat (Nouka) Silhouette -->
  <g transform="translate(330, 560)">
    <path d="M 0 36 Q 110 72 240 32 L 212 56 Q 110 82 28 56 Z" fill="#141312"/>
    <path d="M 75 44 Q 115 -2 155 42" fill="#2A2724" stroke="#141312" stroke-width="1.5"/>
    <line x1="42" y1="48" x2="12" y2="82" stroke="#141312" stroke-width="2"/>
    <!-- Boat Reflection -->
    <path d="M 28 66 Q 110 86 205 64" fill="none" stroke="#141312" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>

  <!-- Foreground Kans Grass (Saccharum spontaneum) Silhouette -->
  <g stroke="#141312" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 90 854 Q 115 710 155 610"/>
    <path d="M 110 854 Q 145 730 195 645"/>
    <path d="M 135 854 Q 125 740 95 660"/>
    <path d="M 165 854 Q 195 755 235 690"/>
  </g>
  <g fill="#F7F5F0" stroke="#141312" stroke-width="0.8">
    <ellipse cx="155" cy="608" rx="6" ry="22" transform="rotate(18 155 608)"/>
    <ellipse cx="195" cy="642" rx="6" ry="20" transform="rotate(24 195 642)"/>
    <ellipse cx="95" cy="658" rx="5" ry="18" transform="rotate(-14 95 658)"/>
  </g>

  <!-- Woodblock Colophon Caption -->
  <g font-family="Georgia, serif" font-size="13" fill="#141312" fill-opacity="0.75" letter-spacing="3">
    <text x="72" y="828">PLATE VII · SUBARNAREKHA RIVER MIST AT DAWN · LINOCUT &amp; INK MONOTYPE</text>
  </g>
</svg>
